<!DOCTYPE html>

<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

<body>

  <nav>
    <ul>
      <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/shop.html' | relative_url }}" {% if page.url contains 'shop' %}class="active"{% endif %}>Shop</a></li>
      <li><a href="{{ '/about.html' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>About</a></li>
      <li><a href="{{ '/contact.html' | relative_url }}" {% if page.url contains 'contact' %}class="active"{% endif %}>Contact</a></li>
    </ul>

{{ content }}
